# Remote configuration for HPC SLURM cluster

# Allow overriding NTASKS and GRES via environment variables
# Example: NTASKS=2 ./scripts/run_remote.sh hpc make launch-2
NTASKS=${NTASKS:-4}
GRES=${GRES:-gpu:0}

# SLURM_MPI_TYPE specifies the PMI wire protocol for MPI.
# Julia's default MPICH_jll expects PMI2.
SLURM_MPI_TYPE=${SLURM_MPI_TYPE:-pmi2}

WRAPPER="SLURM_MPI_TYPE=$SLURM_MPI_TYPE salloc --ntasks=$NTASKS --gres=$GRES --mem=32G --cpus-per-task=2 --account=3320522 --partition=stud --qos=stud"
