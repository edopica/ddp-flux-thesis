# Remote configuration for HPC SLURM cluster

# Allow overriding NTASKS and GRES via environment variables
# Example: NTASKS=2 ./scripts/run_remote.sh hpc make launch-2
NTASKS=${NTASKS:-4}
GRES=${GRES:-gpu:0}

WRAPPER="salloc --ntasks=$NTASKS --gres=$GRES --mem=32G --cpus-per-task=2 --account=3320522 --partition=stud --qos=stud"
