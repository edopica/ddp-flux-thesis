# Remote configuration for the Leonardo cluster (CINECA). SSH alias: leonardo
# (login.leonardo.cineca.it, user epicazio). See wiki/context/leonardo.md.
#
# Slurm: account iscrc_unmasked, partition boost_usr_prod, QoS boost_qos_dbg
# (30 min cap) by default. Long 1-node runs: QOS=boost_qos_lprod TIME=02:00:00
# (boost_qos_bprod requires >=65 nodes via MinTRES and rejects -N1 jobs with
# QOSMinCpuNotSatisfied — verified 2026-10-16).
# Julia and the package depot live on $WORK (the 50 GB home is too small).
# NEVER precompile on the login node: run scripts/remote/precompile.sh or an
# explicit inner srun step on the compute node.
#
# Resource overrides are environment prefixes on the script:
#   NTASKS=4 CPUS_PER_TASK=4 scripts/remote/run.sh leonardo "..."

NTASKS=${NTASKS:-4}
CPUS_PER_TASK=${CPUS_PER_TASK:-4}
GRES=${GRES:-gpu:4}
TIME=${TIME:-00:30:00}
QOS=${QOS:-boost_qos_dbg}

# Julia's default MPICH_jll expects the PMI2 wire protocol on Slurm.
SLURM_MPI_TYPE=${SLURM_MPI_TYPE:-pmi2}

# Stop Pkg operations from precompiling on the login node.
JULIA_PKG_PRECOMPILE_AUTO=${JULIA_PKG_PRECOMPILE_AUTO:-0}

WORK=${WORK:-/leonardo_work/IscrC_UNMASKED}
JULIA_PREFIX=${JULIA_PREFIX:-$WORK/epicazio/julia-1.12.6}
JULIA_DEPOT_PATH=${JULIA_DEPOT_PATH:-$WORK/epicazio/julia-depot}

# GPUs: --gres=gpu:4 makes all four A100 of the allocated node visible to every
# rank. FluxMPIExt maps local rank r to device mod1(r + 2, ndevices), so four
# ranks use four distinct GPUs. Do NOT use --gpus-per-task=1 for the Phase J/J2
# regression: it asserts CUDA.ndevices() >= ranks.
WRAPPER="JULIA_DEPOT_PATH=$JULIA_DEPOT_PATH PATH=$JULIA_PREFIX/bin:\$PATH SLURM_MPI_TYPE=$SLURM_MPI_TYPE JULIA_PKG_PRECOMPILE_AUTO=$JULIA_PKG_PRECOMPILE_AUTO salloc --account=iscrc_unmasked --partition=boost_usr_prod --qos=$QOS -N1 --ntasks=$NTASKS --cpus-per-task=$CPUS_PER_TASK --gres=$GRES --time=$TIME"
