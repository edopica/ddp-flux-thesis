# Remote configuration for the Bocconi SLURM cluster (ssh alias: bocconi,
# real hostname slogin.hpc.unibocconi.it).

# Allow overriding NTASKS and GRES via environment variables
# Example: NTASKS=2 ./scripts/remote/run.sh bocconi make launch-2
NTASKS=${NTASKS:-4}
CPUS_PER_TASK=${CPUS_PER_TASK:-2}
GRES=${GRES:-gpu:0}

# SLURM_MPI_TYPE specifies the PMI wire protocol for MPI.
# Julia's default MPICH_jll expects PMI2.
SLURM_MPI_TYPE=${SLURM_MPI_TYPE:-pmi2}

# Precompilation guard (Julia 1.12, measured 2026-09-03):
# - Never precompile on the login node: caches bake the host CPU feature set
#   (login = graniterapids; compute gnode01/02 = icelake-server, flag-identical
#   to each other but NOT to login). Login compiles are wasted work that still
#   leaves compute-node tests cold. Run `scripts/remote/precompile.sh bocconi`
#   (runs julia under srun on a compute node) after every code sync.
# - JULIA_CPU_TARGET (env) does NOT pin the loading process; only the CLI
#   flag -C does, and even -C cannot bridge the graniterapids/icelake gap.
# - JULIA_PKG_PRECOMPILE_AUTO=0 stops Pkg OPERATIONS (develop/add/instantiate)
#   from precompiling, e.g. during `make env` on the login node. It does NOT
#   stop silent load-time recompiles of stale caches (`using Flux` will still
#   recompile, with or without it). Run `scripts/remote/precompile.sh bocconi`
#   after every code sync so caches are never stale during tests.
JULIA_PKG_PRECOMPILE_AUTO=${JULIA_PKG_PRECOMPILE_AUTO:-0}

WRAPPER="SLURM_MPI_TYPE=$SLURM_MPI_TYPE JULIA_PKG_PRECOMPILE_AUTO=$JULIA_PKG_PRECOMPILE_AUTO salloc --ntasks=$NTASKS --gres=$GRES --mem=32G --cpus-per-task=$CPUS_PER_TASK --account=3320522 --partition=stud --qos=stud"
