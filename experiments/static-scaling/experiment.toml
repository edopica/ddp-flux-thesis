[tolerances]
status = "recorded 2026-10-17 (OD-10 calibration revision; base rule plus three frozen backward-category floors)"
comparison_rule = "elementwise |a - b| <= atol + rtol * max(|a|, |b|)"
same_framework = { atol = 2.0e-6, rtol = 1.0e-5, basis = "existing project standard (Phase K, C8 matrix); applies to DDP vs single-GPU reference and to rank replicas" }
cross_framework = { atol = 1.0e-5, rtol = 1.0e-4, basis = "recorded 2026-10-17: base rule for every category except the three phase3 backward categories below; frozen before the Step 3c acceptance run" }
categories = ["logits", "loss", "gradients", "updated parameters", "optimizer moments m and v", "step counters"]
calibration_evidence = [
  "artifacts/logs/static-scaling/2026-10-17-phase3-numerics/RESULTS.md",
  "same-framework PyTorch CPU-vs-GPU control (PyTorch CPU reference job 60912525, node lrdn3450; Flux CPU checker job 60912664): grads.u1 3.021732e-4 / 14,365 violations, grads.u3 4.099458e-4 / 128,170, m.u3 5.057361e-5 / 1,137; this control fails the base rule on exactly the same three categories as Flux, with the same worst leaves",
]
calibration_rule = "a revision of a tolerance requires a documented numerical cause (kernel or reduction-order difference), recorded in this file before the acceptance evidence is generated"

[tolerances.category_overrides."phase3.grads.u1"]
atol = 1.0e-3
rtol = 1.0e-4
basis = "PyTorch CPU-vs-GPU same-framework control fails the base rule at 3.021732e-4 with 14,365 violations; four-comparison Flux/PyTorch envelope max 4.126653e-4; >=2.42x margin; per-leaf relative L2 stays supplementary"

[tolerances.category_overrides."phase3.grads.u3"]
atol = 2.0e-3
rtol = 1.0e-4
basis = "PyTorch CPU-vs-GPU same-framework control fails the base rule at 4.099458e-4 with 128,170 violations; four-comparison Flux/PyTorch envelope max 7.480253e-4; >=2.67x margin; per-leaf relative L2 stays supplementary"

[tolerances.category_overrides."phase3.m.u3"]
atol = 2.0e-4
rtol = 1.0e-4
basis = "PyTorch CPU-vs-GPU same-framework control fails the base rule at 5.057361e-5 with 1,137 violations; four-comparison Flux/PyTorch envelope max 9.655068e-5; >=2.07x margin; per-leaf relative L2 stays supplementary"
